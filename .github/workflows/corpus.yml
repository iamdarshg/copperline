name: corpus

# Optional: run the routing corpus and publish the results artifact.
# Manual dispatch (or a weekly scheduled run); it is not required for PRs.
on:
  workflow_dispatch:
    inputs:
      timeout:
        description: "Per-board routing timeout (seconds)"
        required: false
        default: "20"
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build g++

      - name: Build router
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4 --target router

      - name: Generate synthetic corpus
        run: python3 tools/gen_boards.py --out build/corpus-boards

      - name: Run corpus (fixtures + generated)
        run: |
          python3 tools/corpus_harness.py \
            --boards fixtures build/corpus-boards \
            --out build/corpus-out \
            --timeout "${{ github.event.inputs.timeout || '20' }}" \
            --threads 2 --budget-mb 256

      - name: Summarize
        run: |
          python3 - <<'PY'
          import json, collections
          rows = json.load(open("build/corpus-out/corpus.json"))
          c = collections.Counter(r.get("status") for r in rows)
          ok = sum(1 for r in rows if r.get("status") == "COMPLETE" and r.get("legal"))
          print(f"{len(rows)} boards, {ok} COMPLETE+legal")
          for k, v in c.most_common():
              print(f"  {k}: {v}")
          PY

      - name: Upload corpus results
        uses: actions/upload-artifact@v4
        with:
          name: corpus-results
          path: build/corpus-out/corpus.json

  # TWO GATES. Legality must pass; completion is the open work and is expected
  # to fail until the boards route (see the handoff). All four gate steps run
  # regardless, then a final step fails the job if any gate failed - so the log
  # always shows the full picture instead of stopping at the first red.
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build g++

      - name: Build router
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4 --target router

      - name: Legality gate (short tier)
        id: legal_short
        continue-on-error: true
        run: |
          python3 tests/test_corpus_boards.py --tier short --gate legal \
            --cache build/gate-cache --router build/router --threads 4

      - name: Completion gate (short tier)
        id: complete_short
        continue-on-error: true
        run: |
          python3 tests/test_corpus_boards.py --tier short --gate complete \
            --cache build/gate-cache --router build/router --threads 4 \
            --keep-reports build/gate-reports

      - name: Legality gate (long tier, all ten boards)
        id: legal_long
        continue-on-error: true
        run: |
          python3 tests/test_corpus_boards.py --tier long --gate legal \
            --cache build/gate-cache --router build/router --threads 4

      - name: Completion gate (long tier, all ten boards)
        id: complete_long
        continue-on-error: true
        run: |
          python3 tests/test_corpus_boards.py --tier long --gate complete \
            --cache build/gate-cache --router build/router --threads 4 \
            --keep-reports build/gate-reports

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-reports
          path: build/gate-reports
          if-no-files-found: ignore

      - name: Gate summary
        if: always()
        run: |
          echo "legality (short):   ${{ steps.legal_short.outcome }}"
          echo "completion (short): ${{ steps.complete_short.outcome }}"
          echo "legality (long):    ${{ steps.legal_long.outcome }}"
          echo "completion (long):  ${{ steps.complete_long.outcome }}"
          if [ "${{ steps.legal_short.outcome }}"  != "success" ] || \
             [ "${{ steps.legal_long.outcome }}"   != "success" ] || \
             [ "${{ steps.complete_short.outcome }}" != "success" ] || \
             [ "${{ steps.complete_long.outcome }}"  != "success" ]; then
            echo "::error::a corpus gate failed - legality is a hard gate, completion is the open work (docs/validation/corpus/2026-10-29/HANDOFF.md)"
            exit 1
          fi
